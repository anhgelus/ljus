when:
  - event: ["push", "pull_request"]
    branch: main

engine: microvm
image: alpine

steps:
  - name: Installing deps
    command: |
      apk add --no-cache go golangci-lint
  - name: Lint code
    command: |
      go vet -v ./...
      golangci-lint run
  - name: Run tests
    command: |
      go test -v -race -cover ./...
